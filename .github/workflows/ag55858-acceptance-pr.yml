# Round: Phase 3 Flutter on the final APIs (actions AG-55858-phase3-flutter-v2, integration AG-55858-phase3-integration), 2026-10-13,
# round 2: the nested-bundle check looks two levels deep; round 3: the iOS wrapper passes no app-identifiers, the preparation is a script.
# TEMPORARY (AG-55858 acceptance, not for merge): the PR shape of testing.yml without the deploys, the changelogs,
# Android/Windows/web and Slack; the check job takes every artifact by the workflow outputs and verifies it.
name: AG-55858 acceptance (PR shape)

on:
  push:
    branches: [AG-55858-acceptance]

permissions:
  contents: read
  id-token: write
  actions: read

jobs:
  meta:
    runs-on: [team-flutter]
    outputs:
      version: ${{ steps.epoch.outputs.version }}
      version-title: ${{ steps.epoch.outputs.version-title }}
    steps:
      - id: epoch
        uses: AdGuardSoftwareLimited/actions/actions/epoch-version-metadata@master
        with:
          title-suffix: Acceptance

  resolve-runner:
    runs-on: [team-flutter]
    outputs:
      image: ${{ steps.kv.outputs.value }}
    steps:
      - uses: AdGuardSoftwareLimited/actions/actions/kv-get@master
        id: kv
        with:
          key: build-images/macos
  build-ios:
    needs: [meta]
    uses: ./.github/workflows/flutter-build-ios.yml
    secrets: inherit
    with:
      channel: nightly
      version: ${{ needs.meta.outputs.version }}
      build-number: '9104'
      version-title: ${{ needs.meta.outputs.version-title }}
      signing-types: adhoc

  build-macos:
    needs: [meta]
    uses: ./.github/workflows/flutter-build-macos.yml
    secrets: inherit
    with:
      channel: nightly
      version: ${{ needs.meta.outputs.version }}
      build-number: '9104'
      version-title: ${{ needs.meta.outputs.version-title }}
      signing-types: development

  check:
    needs: [build-ios, build-macos, resolve-runner]
    runs-on:
      - ephemeral
      - ephemeral-mac
      - ${{ needs.resolve-runner.outputs.image }}
      - ephemeral-job-key-${{ github.run_id }}-${{ github.job }}-${{ strategy.job-index || 0 }}
    defaults:
      run:
        shell: bash
    steps:
      - name: The outputs name the products
        env:
          IOS_PRODUCT: ${{ needs.build-ios.outputs.product-name }}
          MAC_PRODUCT: ${{ needs.build-macos.outputs.product-name }}
        run: |
          set -e -x
          test "$IOS_PRODUCT" = Runner
          test "$MAC_PRODUCT" = "TrustTunnel"
      - name: "download adhoc by the output"
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build-ios.outputs.adhoc-artifact }}
          path: artifacts/adhoc
          skip-decompress: true
      - name: "download dev by the output"
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build-macos.outputs.development-artifact }}
          path: artifacts/dev
          skip-decompress: true

      - name: "iOS Ad Hoc: the IPA is signed for testers with the Ad Hoc profile"
        env:
          ARTIFACT: ${{ needs.build-ios.outputs.adhoc-artifact }}
          DIR: artifacts/adhoc
          IPA: artifacts/adhoc/Runner.ipa
          BUNDLE: com.adguard.TrustTunnel
        run: |
          set -euo pipefail
          test "$ARTIFACT" = "Runner.ipa"
          ls -la "$DIR"
          true
          rm -rf "$DIR/x"; mkdir -p "$DIR/x"; unzip -q -o "$IPA" -d "$DIR/x"
          app="$DIR/x/Payload/Runner.app"; test -d "$app"
          codesign -dvv "$app" 2>&1 | tee "$RUNNER_TEMP/adhoc-codesign.txt"
          grep -q 'Authority=Apple Distribution: Adguard Software Limited (TC3Q7MAJXF)' "$RUNNER_TEMP/adhoc-codesign.txt"
          grep -q "Identifier=$BUNDLE" "$RUNNER_TEMP/adhoc-codesign.txt"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -d --entitlements :- "$app" 2>/dev/null | tee "$RUNNER_TEMP/adhoc-entitlements.plist" | head -c 4000
          /usr/libexec/PlistBuddy -c 'Print :application-identifier' "$RUNNER_TEMP/adhoc-entitlements.plist" | grep -q "^TC3Q7MAJXF\.$BUNDLE$"
          security cms -D -i "$app/embedded.mobileprovision" > "$RUNNER_TEMP/adhoc-profile.plist"
          /usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/adhoc-profile.plist"
          /usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' "$RUNNER_TEMP/adhoc-profile.plist" | grep -q -E '^ +[0-9a-f]{8}' || { echo "::error::an Ad Hoc profile must list devices"; exit 1; }
          # the nested bundles are signed by the same identity
          find "$app" -mindepth 2 -maxdepth 3 \( -name '*.framework' -o -name '*.appex' \) | while read -r nested; do codesign -dvv "$nested" 2>&1 | grep -q 'Authority=Apple Distribution: Adguard Software Limited' || { echo "::error::$nested is not signed by Apple Distribution"; exit 1; }; done

      - name: "macOS Development: the app zip for testers is signed Apple Development with its nested code"
        env:
          ARTIFACT: ${{ needs.build-macos.outputs.development-artifact }}
          BUNDLE: com.adguard.TrustTunnel
        run: |
          set -euo pipefail
          test "$ARTIFACT" = "TrustTunnel-development.app.zip"
          rm -rf artifacts/dev/x; mkdir -p artifacts/dev/x
          ditto -x -k "artifacts/dev/TrustTunnel-development.app.zip" artifacts/dev/x
          app="artifacts/dev/x/TrustTunnel-development.app"; test -d "$app" || app="artifacts/dev/x/TrustTunnel.app"; test -d "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dvv "$app" 2>&1 | tee "$RUNNER_TEMP/dev-codesign.txt"
          grep -q 'Authority=Apple Development:' "$RUNNER_TEMP/dev-codesign.txt"
          grep -q "Identifier=$BUNDLE" "$RUNNER_TEMP/dev-codesign.txt"
          test -f "$app/Contents/embedded.provisionprofile"
          find "$app/Contents" -maxdepth 3 \( -name '*.appex' -o -name '*.app' -o -name '*.systemextension' \) | while read -r nested; do echo "$nested"; codesign -dvv "$nested" 2>&1 | grep -E 'Authority=Apple Development|Identifier=' | head -n 2; done
