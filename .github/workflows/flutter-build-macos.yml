name: Flutter Build macOS

# The macOS build of this product through the shared build-flutter-macos-app.yml (AdGuardSoftwareLimited/actions):
# the Flutter SDK of the project and the preparation of this repository run in the build job, the shared
# workflow archives Runner once without signing material, signs every signing type from that archive in its
# own job, notarizes the Developer ID result in another one and names the artifacts after the product
# (TrustTunnel); the names are the outputs.

on:
  workflow_call:
    inputs:
      version:
        type: string
        default: '0.0.0'
        description: 'Version string for build'
      build-number:
        type: string
        default: '1'
        description: 'Build number'
      version-title:
        type: string
        default: ''
        description: 'Human-readable version title'
      channel:
        type: string
        required: true
        description: 'Build channel (nightly, beta, rc, release)'
      signing-types:
        type: string
        required: true
        description: 'Distribution methods signed from the one archive, comma-separated: appstore, development'
      sentry-project:
        type: string
        default: ''
        description: 'Sentry project slug. If empty, Sentry upload is skipped.'
      release:
        type: string
        default: ''
        description: 'Release identifier for Sentry (e.g. "5.0")'
    outputs:
      product-name:
        description: 'The application the archive holds (TrustTunnel)'
        value: ${{ jobs.build.outputs.product-name }}
      appstore-artifact:
        description: 'TrustTunnel-appstore: TrustTunnel.pkg + AppStoreInfo.plist, what deploy-to-testflight.yml takes'
        value: ${{ jobs.build.outputs.appstore-artifact }}
      development-artifact:
        description: 'TrustTunnel-development.app.zip: the Development-signed app for testers, a ditto zip'
        value: ${{ jobs.build.outputs.development-artifact }}

permissions:
  contents: read
  id-token: write

jobs:
  build:
    uses: AdGuardSoftwareLimited/actions/.github/workflows/build-flutter-macos-app.yml@AG-55858-phase3-integration
    secrets: inherit
    with:
      flutter-version: '3.44.9'
      signing-types: ${{ inputs.signing-types }}
      app-identifiers: com.adguard.TrustTunnel,com.adguard.TrustTunnel.Extension
      channel: ${{ inputs.channel }}
      version: ${{ inputs.version }}
      version-title: ${{ inputs.version-title }}
      build-number: ${{ inputs.build-number }}
      release: ${{ inputs.release }}
      sentry-project: ${{ inputs.sentry-project }}
      # The package registry token of the preparation: the one secret the build job receives.
      prepare-secret: PUBLIC_REPO_GPR_KEY
      prepare-secret-env: GPR_KEY
      # The preparation of this repository, run in the build job with the Flutter SDK on PATH; PROJECT_VERSION
      # and BUILD_NUMBER are the version inputs.
      prepare-script: |
        set -x
        # Ruby for CocoaPods.
        eval "$(rbenv init - bash)"
        rbenv install 3.3.10 --skip-existing
        rbenv local 3.3.10
        rbenv rehash
        printf '%s\n' "$HOME/.rbenv/bin" "$HOME/.rbenv/shims" >> "$GITHUB_PATH"
        gem install bundler -v 2.7.2
        rbenv rehash
        export BUNDLER_VERSION=2.7.2
        (cd macos && bundle config set --local path '.bundle/vendor' && bundle install)
        # Dependencies and code generation (the package registry token is GPR_KEY), CocoaPods.
        git config --global --add safe.directory /opt/flutter
        make init
        (cd macos && bundle exec pod install)
        # The Xcode configuration of the Flutter tool: the version and the build number.
        flutter build macos --release --build-name="$PROJECT_VERSION" --build-number="$BUILD_NUMBER" --no-pub --config-only
        # CocoaPods vendored frameworks may carry pre-release versions ("1.2.3-beta.4", "5.0.0+abc"), which
        # code signing and App Store validation reject: keep the SemVer core of CFBundleShortVersionString
        # and CFBundleVersion.
        changed=0
        while IFS= read -r -d '' plist; do
          for key in CFBundleShortVersionString CFBundleVersion; do
            value="$(/usr/libexec/PlistBuddy -c "Print :$key" "$plist" 2>/dev/null || true)"
            [ -z "$value" ] && continue
            clean="${value%%[-+]*}"
            if [ "$clean" != "$value" ]; then
              echo "Sanitizing $key '$value' -> '$clean' in $plist"
              /usr/libexec/PlistBuddy -c "Set :$key $clean" "$plist"
              changed=1
            fi
          done
        done < <(find macos/Pods -type f -name Info.plist -path '*.framework/*' -print0)
        [ "$changed" -eq 1 ] || echo "No pre-release framework versions found."
