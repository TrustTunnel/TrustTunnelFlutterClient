name: Flutter Build macOS

# The macOS build of this product through the shared build-macos.yml: the Flutter and CocoaPods
# preparation of this repository is the prepare-script and the archive is the build-command; the
# shared workflow builds once without signing material (xcodebuild action), signs every distribution
# of that build in its own job (sign-apple), notarizes in another job and uploads the artifacts as
# before. The build is described by the fastlane env file (fastlane-env-path); the outputs are named
# as the build_macos_app lane named them: macos/build/<name>.app, .pkg or .dmg and
# macos/build/AppStoreInfo.plist.

on:
  workflow_call:
    inputs:
      version:
        type: string
        default: '0.0.0'
        description: 'Version string for build'
      build-number:
        type: string
        default: '1'
        description: 'Build number'
      version-title:
        type: string
        default: ''
        description: 'Human-readable version title'
      macos-signing-type:
        type: string
        default: 'development'
        description: 'macOS signing type: development, appstore'
      channel:
        type: string
        required: true
        description: 'Build channel (nightly, beta, rc, release)'
      artifact-name:
        type: string
        default: ''
        description: 'Name for uploaded build artifact'
      artifact-path:
        type: string
        default: ''
        description: 'Path to build output file(s)'
      additional-distributions:
        type: string
        default: '[]'
        description: 'More distributions signed from the same build, as a JSON array of {"signing-type", "artifact-name", "artifact-path", "notarize"}'
      fastlane-env-path:
        type: string
        default: 'macos/fastlane/.env'

permissions:
  contents: read
  id-token: write

jobs:
  build:
    uses: AdGuardSoftwareLimited/actions/.github/workflows/build-macos.yml@AG-55858-phase3-integration
    secrets: inherit
    with:
      channel: ${{ inputs.channel }}
      version: ${{ inputs.version }}
      version-title: ${{ inputs.version-title }}
      build-number: ${{ inputs.build-number }}
      signing-type: ${{ inputs.macos-signing-type }}
      app-identifiers: com.adguard.TrustTunnel,com.adguard.TrustTunnel.Extension
      additional-cert-types: ${{ inputs.macos-signing-type == 'appstore' && 'mac_installer_distribution' || '' }}
      # The export options of the build_macos_app lane.
      export-options: ${{ inputs.macos-signing-type == 'appstore' && '{"manageAppVersionAndBuildNumber":true,"generateAppStoreInformation":true,"uploadSymbols":true}' || '{"manageAppVersionAndBuildNumber":false,"generateAppStoreInformation":false}' }}
      prepare-secret: PUBLIC_REPO_GPR_KEY
      prepare-secret-env: GPR_KEY
      prepare-script: |
        set -euo pipefail
        set -x

        # Flutter of the image (/opt/flutter), owned by another user.
        git config --global --add safe.directory /opt/flutter

        # Ruby for CocoaPods.
        eval "$(rbenv init - bash)"
        rbenv install 3.3.10 --skip-existing
        rbenv local 3.3.10
        rbenv rehash
        printf '%s\n' "$HOME/.rbenv/bin" "$HOME/.rbenv/shims" >> "$GITHUB_PATH"
        gem install bundler -v 2.7.2
        rbenv rehash
        export BUNDLER_VERSION=2.7.2
        (cd macos && bundle config set --local path '.bundle/vendor' && bundle install)

        make init
        (cd macos && bundle exec pod install)

        flutter build macos --release \
          --build-name="${{ inputs.version }}" \
          --build-number="${{ inputs.build-number }}" \
          --no-pub \
          --config-only

        # CocoaPods vendored frameworks may carry pre-release versions ("1.2.3-beta.4", "5.0.0+abc"),
        # which code signing and App Store validation reject: keep the SemVer core of
        # CFBundleShortVersionString and CFBundleVersion.
        changed=0
        while IFS= read -r -d '' plist; do
          for key in CFBundleShortVersionString CFBundleVersion; do
            value="$(/usr/libexec/PlistBuddy -c "Print :$key" "$plist" 2>/dev/null || true)"
            [ -z "$value" ] && continue
            clean="${value%%[-+]*}"
            if [ "$clean" != "$value" ]; then
              echo "Sanitizing $key '$value' -> '$clean' in $plist"
              /usr/libexec/PlistBuddy -c "Set :$key $clean" "$plist"
              changed=1
            fi
          done
        done < <(find macos/Pods -type f -name Info.plist -path '*.framework/*' -print0)
        [ "$changed" -eq 1 ] || echo "No pre-release framework versions found."
      build-command: |
        set -euo pipefail
        set -a; . "${{ inputs.fastlane-env-path }}"; set +a
        cd macos
        xcodebuild archive \
          -workspace Runner.xcworkspace \
          -scheme "$CUSTOM_FASTLANE_SCHEMA" \
          -configuration Release \
          -destination 'generic/platform=macOS' \
          -archivePath "$FASTLANE_BUILD_DIRECTORY/$CUSTOM_FASTLANE_BUILD_NAME.xcarchive" \
          -derivedDataPath "$FASTLANE_BUILD_DIRECTORY/derived_data"
      artifact-name: ${{ inputs.artifact-name }}
      artifact-path: ${{ inputs.artifact-path }}
      artifact-archive: true
      # Developer ID builds for testers were always notarized.
      notarize: ${{ inputs.macos-signing-type == 'developer_id' }}
      additional-distributions: ${{ inputs.additional-distributions }}
