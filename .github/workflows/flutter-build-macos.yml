name: Flutter Build macOS

# Builds the app once without signing material, then signs every requested distribution of that
# same build in its own job:
#
#   build  Flutter and CocoaPods preparation, then the xcodebuild action: a Release archive with
#          deferred signing (unsigned-build.zip). The build job has no id-token and never sees
#          signing material.
#   sign   one job per distribution (macos-signing-type plus additional-distributions): the
#          sign-apple action exports the same archive, and the result is uploaded under
#          artifact-name from artifact-path, as before (a Development app as a ditto zip).
#
# Fastlane is not run. The build is described by the fastlane env file (fastlane-env-path), and the
# outputs are named as the build_macos_app lane named them: macos/build/<CUSTOM_FASTLANE_BUILD_NAME>.app
# or .pkg, and macos/build/AppStoreInfo.plist. Targets without a provisioning profile
# (SIGNING_TARGETS_NO_PROFILE) are signed with the distribution identity only, as the lane signed them.

on:
  workflow_call:
    inputs:
      version:
        type: string
        default: '0.0.0'
        description: 'Version string for build'
      build-number:
        type: string
        default: '1'
        description: 'Build number'
      version-title:
        type: string
        default: ''
        description: 'Human-readable version title'
      macos-signing-type:
        type: string
        default: 'development'
        description: 'macOS signing type: development, appstore'
      channel:
        type: string
        required: true
        description: 'Build channel (nightly, beta, rc, release)'
      artifact-name:
        type: string
        default: ''
        description: 'Name for uploaded build artifact'
      artifact-path:
        type: string
        default: ''
        description: 'Path to build output file(s)'
      additional-distributions:
        type: string
        default: '[]'
        description: 'More distributions signed from the same build, as a JSON array of {"signing-type", "artifact-name", "artifact-path"}'
      fastlane-env-path:
        type: string
        default: 'macos/fastlane/.env'

permissions:
  contents: read
  id-token: write

jobs:
  resolve-runner:
    runs-on: [team-flutter]
    outputs:
      image: ${{ steps.kv.outputs.value }}
    steps:
      - uses: AdGuardSoftwareLimited/actions/actions/kv-get@master
        id: kv
        with:
          key: build-images/macos

  build:
    needs: [resolve-runner]
    runs-on:
      - ephemeral
      - ephemeral-mac
      - ${{ needs.resolve-runner.outputs.image }}
      - ephemeral-limit-memory-7168
      - ephemeral-limit-cpu-4
      - ephemeral-limit-disk-gb-20
      - ephemeral-job-key-${{ github.run_id }}-${{ github.job }}-${{ strategy.job-index || 0 }}
    # The build never gets signing material: without id-token it cannot read it from Vault.
    permissions:
      contents: read
    outputs:
      distributions: ${{ steps.params.outputs.distributions }}
      unsigned-artifact: ${{ steps.params.outputs.unsigned-artifact }}
      sha256: ${{ steps.archive.outputs.sha256 }}
      build-dir: ${{ steps.params.outputs.build-dir }}
      build-name: ${{ steps.params.outputs.build-name }}
      app-identifiers: ${{ steps.params.outputs.app-identifiers }}
    defaults:
      run:
        shell: bash
    env:
      GPR_KEY: ${{ secrets.PUBLIC_REPO_GPR_KEY }}
    steps:
      - name: Fix Flutter git safe directory
        run: git config --global --add safe.directory /opt/flutter

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Apply PR overrides
        uses: AdGuardSoftwareLimited/actions/actions/apply-pr-overrides@master

      - name: Load signing env
        run: |
          grep -vE '^\s*(#|$)' "${{ inputs.fastlane-env-path }}" >> "$GITHUB_ENV"

      - name: Prepare Ruby environment
        run: |
          set -euo pipefail
          set -x
          eval "$(rbenv init - bash)"
          rbenv install 3.3.10 --skip-existing
          rbenv local 3.3.10
          rbenv rehash
          printf '%s\n' "$HOME/.rbenv/bin" "$HOME/.rbenv/shims" >> "$GITHUB_PATH"
          gem install bundler -v 2.7.2
          rbenv rehash
          export BUNDLER_VERSION=2.7.2
          cd macos
          bundle config set --local path '.bundle/vendor'
          bundle install
          cd ..

      - name: Flutter pub get and code generation
        run: make init

      - name: Pod install
        run: |
          set -euo pipefail
          cd macos
          bundle exec pod install
          cd ..

      - name: Generate Flutter macOS config files
        env:
          PROJECT_VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.build-number }}
        run: |
          set -euo pipefail
          flutter build macos --release \
            --build-name="$PROJECT_VERSION" \
            --build-number="$BUILD_NUMBER" \
            --no-pub \
            --config-only

      # CocoaPods vendored .framework bundles sometimes carry pre-release version
      # strings in their Info.plist (e.g. "1.2.3-beta.4" or "5.0.0+abc123").
      # Apple's code-signing and notarization reject any version that contains
      # a hyphen (-) or plus (+) — it must be a strict SemVer core
      # (MAJOR.MINOR.PATCH).
      #
      # This step walks every Info.plist inside macos/Pods/**/*.framework/ and
      # strips the pre-release/build-metadata suffix from two keys:
      #
      #   CFBundleShortVersionString  (the user-visible version, e.g. "1.2.3")
      #   CFBundleVersion             (the build number)
      #
      # The shell parameter expansion ${value%%[-+]*} greedily removes
      # everything from the first '-' or '+' onward, leaving only the clean
      # core version.  PlistBuddy writes the sanitized value back in-place.
      #
      # If no pre-release versions are found the step prints a message and
      # exits successfully — it is a no-op for clean dependency trees.
      - name: Sanitize vendored framework versions
        run: |
          set -euo pipefail
          PODS_DIR="macos/Pods"
          test -d "$PODS_DIR" || { echo "Pods directory not found at $PODS_DIR"; exit 1; }

          changed=0
          while IFS= read -r -d '' plist; do
            for key in CFBundleShortVersionString CFBundleVersion; do
              value="$(/usr/libexec/PlistBuddy -c "Print :$key" "$plist" 2>/dev/null || true)"
              [ -z "$value" ] && continue
              clean="${value%%[-+]*}"
              if [ "$clean" != "$value" ]; then
                echo "Sanitizing $key '$value' -> '$clean' in $plist"
                /usr/libexec/PlistBuddy -c "Set :$key $clean" "$plist"
                changed=1
              fi
            done
          done < <(find "$PODS_DIR" -type f -name Info.plist -path '*.framework/*' -print0)

          if [ "$changed" -eq 0 ]; then
            echo "No pre-release framework versions found — nothing to sanitize."
          fi

      - name: Resolve the distributions
        id: params
        env:
          SIGNING_TYPE: ${{ inputs.macos-signing-type }}
          ARTIFACT_NAME: ${{ inputs.artifact-name }}
          ARTIFACT_PATH: ${{ inputs.artifact-path }}
          ADDITIONAL_DISTRIBUTIONS: ${{ inputs.additional-distributions }}
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          import json, os, re, sys

          def fail(message):
              print(f'::error::{message}')
              sys.exit(1)

          additional = json.loads(os.environ['ADDITIONAL_DISTRIBUTIONS'] or '[]')
          if not isinstance(additional, list):
              fail('additional-distributions must be a JSON array')
          entries = [{'signing-type': os.environ['SIGNING_TYPE'], 'artifact-name': os.environ['ARTIFACT_NAME'],
                      'artifact-path': os.environ['ARTIFACT_PATH']}] + additional
          distributions = []
          for entry in entries:
              signing_type = entry.get('signing-type', '')
              # The signing types of the build_macos_app lane.
              if signing_type not in ('development', 'appstore'):
                  fail(f'Unknown signing type: {signing_type!r}. Expected: development, appstore')
              distributions.append({'signing_type': signing_type,
                                    'artifact_name': entry.get('artifact-name', ''),
                                    'artifact_path': entry.get('artifact-path', '')})
          types = [d['signing_type'] for d in distributions]
          names = [d['artifact_name'] or 'artifact' for d in distributions]
          if len(set(types)) != len(types) or len(set(names)) != len(names):
              fail(f'each distribution needs its own signing-type and artifact-name: {distributions}')

          base = re.sub(r'[\\/:*?"<>|\r\n]', '-', os.environ['ARTIFACT_NAME'] or os.environ['ARTIFACT_PATH'])
          outputs = {
              'distributions': json.dumps(distributions),
              'unsigned-artifact': f'{base}-unsigned-build',
              'build-dir': os.environ['FASTLANE_BUILD_DIRECTORY'],
              'build-name': os.environ['CUSTOM_FASTLANE_BUILD_NAME'],
              'app-identifiers': os.environ['APP_IDENTIFIERS'],
          }
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              for key, value in outputs.items():
                  f.write(f'{key}={value}\n')
                  print(f'{key}={value}')
          PY

      - name: Build the archive (no signing material)
        id: archive
        uses: AdGuardSoftwareLimited/actions/actions/xcodebuild@master
        with:
          signing: deferred
          working-directory: macos
          workspace: Runner.xcworkspace
          scheme: ${{ env.CUSTOM_FASTLANE_SCHEMA }}
          destination: generic/platform=macOS
          derived-data-path: ${{ env.FASTLANE_BUILD_DIRECTORY }}/derived_data
          archive-path: ${{ env.FASTLANE_BUILD_DIRECTORY }}/${{ env.CUSTOM_FASTLANE_BUILD_NAME }}.xcarchive
          team-id: ${{ env.TEAM_ID }}
          output-path: ${{ runner.temp }}/${{ steps.params.outputs.unsigned-artifact }}.zip

      # Uploaded as-is (archive: false), so the artifact is named after the file.
      - name: Upload the unsigned build
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/${{ steps.params.outputs.unsigned-artifact }}.zip
          archive: false
          retention-days: 7
          if-no-files-found: error

  sign:
    needs: [resolve-runner, build]
    name: sign (${{ matrix.distribution.signing_type }})
    runs-on:
      - ephemeral
      - ephemeral-mac
      - ${{ needs.resolve-runner.outputs.image }}
      - ephemeral-limit-memory-7168
      - ephemeral-limit-cpu-4
      - ephemeral-limit-disk-gb-20
      - ephemeral-job-key-${{ github.run_id }}-${{ github.job }}-${{ strategy.job-index || 0 }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        distribution: ${{ fromJSON(needs.build.outputs.distributions) }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Download the unsigned build
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.unsigned-artifact }}.zip
          path: ${{ runner.temp }}/unsigned
          # A raw .zip artifact would otherwise be extracted on download.
          skip-decompress: true

      - name: Sign
        id: sign
        uses: AdGuardSoftwareLimited/actions/actions/sign-apple@master
        with:
          input: ${{ runner.temp }}/unsigned/${{ needs.build.outputs.unsigned-artifact }}.zip
          sha256: ${{ needs.build.outputs.sha256 }}
          method: ${{ matrix.distribution.signing_type }}
          vault-url: ${{ vars.VAULT_URL }}
          app-identifiers: ${{ needs.build.outputs.app-identifiers }}
          additional-cert-types: ${{ matrix.distribution.signing_type == 'appstore' && 'mac_installer_distribution' || '' }}
          # The export options of the build_macos_app lane.
          export-options: ${{ matrix.distribution.signing_type == 'appstore' && '{"manageAppVersionAndBuildNumber":true,"generateAppStoreInformation":true,"uploadSymbols":true}' || '{"manageAppVersionAndBuildNumber":false,"generateAppStoreInformation":false}' }}

      - name: Put the signed output where the build lane put it
        env:
          SIGNED_DIR: ${{ steps.sign.outputs.output-dir }}
          OUTPUT_DIR: macos/${{ needs.build.outputs.build-dir }}
          BUILD_NAME: ${{ needs.build.outputs.build-name }}
          SIGNING_TYPE: ${{ matrix.distribution.signing_type }}
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"
          shopt -s nullglob
          if [ "$SIGNING_TYPE" = appstore ]; then
            outputs=("$SIGNED_DIR"/*.pkg); extension=pkg
          else
            outputs=("$SIGNED_DIR"/*.app); extension=app
          fi
          if [ "${#outputs[@]}" -ne 1 ]; then
            echo "::error::expected one .$extension from sign-apple"; ls -la "$SIGNED_DIR"; exit 1
          fi
          ditto "${outputs[0]}" "$OUTPUT_DIR/$BUILD_NAME.$extension"
          if [ -f "$SIGNED_DIR/AppStoreInfo.plist" ]; then
            ditto "$SIGNED_DIR/AppStoreInfo.plist" "$OUTPUT_DIR/AppStoreInfo.plist"
          fi
          ls -la "$OUTPUT_DIR"

      - name: Archive artifact with ditto
        id: archive-artifact
        if: matrix.distribution.signing_type == 'development'
        env:
          ARTIFACT_PATH: ${{ github.workspace }}/${{ matrix.distribution.artifact_path }}
        run: |
          set -euo pipefail
          if [[ -d "$ARTIFACT_PATH" ]]; then
            dir_name=$(basename "$ARTIFACT_PATH")
            archive_name="${dir_name}.zip"
            archive_path="$(dirname "$ARTIFACT_PATH")/$archive_name"
            ditto -c -k --keepParent "$ARTIFACT_PATH" "$archive_path"
            echo "archive-path=$archive_path" >> "$GITHUB_OUTPUT"
          else
            echo "archive-path=$ARTIFACT_PATH" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.distribution.artifact_name }}
          path: ${{ steps.archive-artifact.outputs.archive-path || matrix.distribution.artifact_path }}
          if-no-files-found: error

      - name: Upload the signing report
        if: always() && steps.sign.outputs.report-dir != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.build.outputs.unsigned-artifact }}-${{ matrix.distribution.signing_type }}-report
          path: ${{ steps.sign.outputs.report-dir }}
          if-no-files-found: ignore

