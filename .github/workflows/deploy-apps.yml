name: Build & Deploy
run-name: 'Deploy ${{ inputs.tag }}'

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Semver tag to deploy, for example v1.3.0-beta.1 or v1.3.0'
        required: true
        type: string
      slack-channel:
        description: 'Slack channel for build notification'
        type: string
        default: '#build-trusttunnel'
      deploy-android:
        description: 'Build and deploy the Android app'
        type: boolean
        default: true
      deploy-ios:
        description: 'Build and deploy the iOS app (incl. simulator/Appetize)'
        type: boolean
        default: true
      deploy-macos:
        description: 'Build and deploy the macOS app'
        type: boolean
        default: true

  workflow_call:
    inputs:
      tag:
        type: string
        required: true
        description: 'Semver tag to deploy'
      slack-channel:
        type: string
        default: '#build-trusttunnel'
        description: 'Slack channel for build notification'
      deploy-android:
        type: boolean
        default: true
        description: 'Build and deploy the Android app'
      deploy-ios:
        type: boolean
        default: true
        description: 'Build and deploy the iOS app (incl. simulator/Appetize)'
      deploy-macos:
        type: boolean
        default: true
        description: 'Build and deploy the macOS app'

permissions:
  contents: read
  id-token: write
  actions: read

concurrency:
  group: deploy-${{ inputs.tag }}
  cancel-in-progress: true

jobs:
  meta:
    uses: AdGuardSoftwareLimited/actions/.github/workflows/version-metadata.yml@master
    with:
      team: flutter
      tag: ${{ inputs.tag }}

  build-number:
    needs: [meta]
    runs-on: [team-flutter]
    outputs:
      build-number: ${{ steps.counter.outputs.BUILD_NUMBER }}
    steps:
      - uses: AdGuardSoftwareLimited/actions/actions/kv-multi@master
        id: counter
        with:
          increment: |
            BUILD_NUMBER=trusttunnel-flutter/v${{ needs.meta.outputs.version }}

  params:
    needs: [meta]
    runs-on: [team-flutter]
    outputs:
      play-store-track: ${{ steps.ps.outputs.track }}
      play-store-rollout: ${{ steps.ps.outputs.rollout }}
    steps:
      - name: Compute Play Store parameters
        id: ps
        shell: bash
        env:
          CHANNEL: ${{ needs.meta.outputs.release-channel }}
        run: |
          case "$CHANNEL" in
            nightly)  echo "track=alpha"      >> "$GITHUB_OUTPUT"; echo "rollout=100" >> "$GITHUB_OUTPUT" ;;
            beta)     echo "track=beta"       >> "$GITHUB_OUTPUT"; echo "rollout=5"   >> "$GITHUB_OUTPUT" ;;
            rc)       echo "track=beta"       >> "$GITHUB_OUTPUT"; echo "rollout=5"   >> "$GITHUB_OUTPUT" ;;
            release)  echo "track=production" >> "$GITHUB_OUTPUT"; echo "rollout=5"   >> "$GITHUB_OUTPUT" ;;
            *)        echo "::error::Unknown channel: $CHANNEL"; exit 1 ;;
          esac

  changelog-qa:
    needs: [meta]
    uses: AdGuardSoftwareLimited/actions/.github/workflows/collect-changelog.yml@master
    with:
      team: flutter
      from-ref: ${{ needs.meta.outputs.previous-tag }}
      repo: trusttunnel-flutter-client
      format: md
      private: 'true'
      artifact-name: qa-changelog

  changelog-public:
    needs: [meta]
    uses: AdGuardSoftwareLimited/actions/.github/workflows/collect-changelog.yml@master
    with:
      team: flutter
      from-ref: ${{ needs.meta.outputs.previous-tag }}
      repo: trusttunnel-flutter-client
      github-repo: TrustTunnel/TrustTunnelClient
      format: txt
      private: 'false'
      artifact-name: changelog

  build-android:
    needs: [meta, build-number]
    if: inputs.deploy-android == 'true'
    uses: ./.github/workflows/flutter-build-android.yml
    secrets: inherit
    with:
      version: ${{ needs.meta.outputs.version }}
      build-number: ${{ needs.build-number.outputs.build-number }}
      version-title: ${{ needs.meta.outputs.version-title }}
      channel: ${{ needs.meta.outputs.release-channel }}
      build-mode: appbundle
      artifact-name: trusttunnel-android-aab
      artifact-path: build/app/outputs/bundle/release/app-release.aab
      release: ${{ needs.meta.outputs.release }}

  build-ios:
    needs: [meta, build-number]
    if: inputs.deploy-ios == 'true'
    uses: ./.github/workflows/flutter-build-ios.yml
    secrets: inherit
    with:
      version: ${{ needs.meta.outputs.version }}
      build-number: ${{ needs.build-number.outputs.build-number }}
      version-title: ${{ needs.meta.outputs.version-title }}
      channel: ${{ needs.meta.outputs.release-channel }}
      signing-type: appstore
      artifact-name: trusttunnel-ios-ipa
      artifact-path: |
        ios/build/TrustTunnel.ipa
        ios/build/AppStoreInfo.plist
      release: ${{ needs.meta.outputs.release }}

  build-simulator:
    needs: [meta, build-number]
    if: inputs.deploy-ios == 'true'
    uses: ./.github/workflows/flutter-build-ios.yml
    secrets: inherit
    with:
      version: ${{ needs.meta.outputs.version }}
      build-number: ${{ needs.build-number.outputs.build-number }}
      version-title: ${{ needs.meta.outputs.version-title }}
      channel: ${{ needs.meta.outputs.release-channel }}
      build-mode: simulator
      artifact-name: TrustTunnel.app.zip
      artifact-path: ios/build/TrustTunnel.app.zip

  build-macos-appstore:
    needs: [meta, build-number]
    if: inputs.deploy-macos == 'true'
    uses: ./.github/workflows/flutter-build-macos.yml
    secrets: inherit
    with:
      version: ${{ needs.meta.outputs.version }}
      build-number: ${{ needs.build-number.outputs.build-number }}
      version-title: ${{ needs.meta.outputs.version-title }}
      channel: ${{ needs.meta.outputs.release-channel }}
      macos-signing-type: appstore
      artifact-name: trusttunnel-macos-appstore
      artifact-path: |
        macos/build/TrustTunnel.pkg
        macos/build/AppStoreInfo.plist
      release: ${{ needs.meta.outputs.release }}

  deploy-testflight:
    needs: [meta, build-ios, changelog-public]
    if: inputs.deploy-ios == 'true'
    uses: AdGuardSoftwareLimited/actions/.github/workflows/deploy-to-testflight.yml@master
    with:
      team: flutter
      asset-artifact-name: trusttunnel-ios-ipa
      changelog-artifact-name: changelog.txt
      groups: ${{ needs.meta.outputs.release-channel == 'nightly' && 'Nightly testers' || 'Review testers' }}
      distribute-external: true
      submit-beta-review: false
      environment: ${{ needs.meta.outputs.release-channel }}-testflight

  deploy-google-play:
    needs: [meta, params, build-number, build-android, changelog-public]
    if: inputs.deploy-android == 'true'
    uses: AdGuardSoftwareLimited/actions/.github/workflows/deploy-to-google-play.yml@master
    with:
      team: flutter
      package-name: com.adguard.trusttunnel
      track: ${{ needs.params.outputs.play-store-track }}
      rollout-percent: ${{ needs.params.outputs.play-store-rollout }}
      release-name: ${{ needs.meta.outputs.version-title }}
      artifact-pattern: trusttunnel-android-aab
      version-codes: ${{ needs.build-number.outputs.build-number }}
      changelog-text: ${{ needs.changelog-public.outputs.changelog-text }}
      environment: ${{ needs.meta.outputs.release-channel }}-google-play

  deploy-appetize:
    needs: [meta, build-simulator]
    if: inputs.deploy-ios == 'true'
    uses: AdGuardSoftwareLimited/actions/.github/workflows/deploy-to-appetize.yml@master
    with:
      team: flutter
      artifact-name: TrustTunnel.app.zip
      platform: ios
      note: 'Channel: ${{ needs.meta.outputs.release-channel }} | Version: ${{ needs.meta.outputs.version-title }} | Tag: ${{ inputs.tag }}'
      environment: ${{ needs.meta.outputs.release-channel }}-appetize

  deploy-macos-testflight:
    needs: [meta, build-macos-appstore, changelog-public]
    if: inputs.deploy-macos == 'true'
    uses: AdGuardSoftwareLimited/actions/.github/workflows/deploy-to-testflight.yml@master
    with:
      team: flutter
      asset-artifact-name: trusttunnel-macos-appstore
      changelog-artifact-name: changelog.txt
      groups: ${{ needs.meta.outputs.release-channel == 'nightly' && 'Nightly testers' || 'Review testers' }}
      distribute-external: true
      submit-beta-review: false
      environment: ${{ needs.meta.outputs.release-channel }}-testflight

  deployed-platforms:
    needs: [build-android, build-ios, build-macos-appstore]
    runs-on: [team-flutter]
    outputs:
      platforms: ${{ steps.list.outputs.platforms }}
    steps:
      - name: Collect deployed platforms
        id: list
        shell: bash
        run: |
          set -euo pipefail

          platforms=""

          if [ "${{ needs.build-android.result }}" = "success" ]; then
            platforms="${platforms:+$platforms,}android"
          fi
          if [ "${{ needs.build-ios.result }}" = "success" ]; then
            platforms="${platforms:+$platforms,}ios"
          fi
          if [ "${{ needs.build-macos-appstore.result }}" = "success" ]; then
            platforms="${platforms:+$platforms,}macos"
          fi

          [ -z "$platforms" ] && platforms="none"

          echo "platforms=$platforms" >> "$GITHUB_OUTPUT"
          echo "Deployed platforms: $platforms"

  notify-slack:
    needs: [meta, build-android, build-ios, build-simulator, build-macos-appstore, deployed-platforms]
    if: inputs.slack-channel != '' && contains(needs.deployed-platforms.outputs.platforms, matrix.platform)
    strategy:
      matrix:
        include:
          - platform: android
            display-name: Android
            emoji: ':aaandroid:'
          - platform: ios
            display-name: iOS
            emoji: ':apple-grey:'
          - platform: macos
            display-name: macOS
            emoji: ':macan:'
    uses: AdGuardSoftwareLimited/actions/.github/workflows/slack-build-notify.yml@master
    with:
      team: flutter
      channel: ${{ inputs.slack-channel || '#build-trusttunnel' }}
      product: ${{ format('{0} {1} TrustTunnel', matrix.emoji, matrix.display-name) }}
      version-title: ${{ needs.meta.outputs.version-title }}
      metadata: >-
        {
          "Channel": "${{ needs.meta.outputs.release-channel }}",
          "Version": "${{ needs.meta.outputs.version }}",
          "Tag": "${{ inputs.tag }}"
        }
  # ===========================================================================
  # build-macos-developer-id & deploy-macos-ak are commented out because macOS
  # Direct Distribution (Developer ID) outside the App Store is not currently
  # needed.  The app is distributed exclusively through TestFlight / App Store
  # for now.
  #
  # If a .dmg deployment is ever required, uncomment both jobs below:
  #   1. build-macos-developer-id  — signs with "Developer ID Application" and
  #      produces a notarized .dmg artifact.
  #   2. deploy-macos-ak           — uploads the .dmg to the AdGuard Knowledge
  #      (AK) binary repository for public download.
