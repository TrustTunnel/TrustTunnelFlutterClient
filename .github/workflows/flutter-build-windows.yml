name: Flutter Build Windows

on:
  workflow_call:
    inputs:
      runner-memory-mb:
        type: string
        default: '12288'
        description: 'Memory limit for ephemeral runner in MB'
      runner-cpu:
        type: string
        default: '4'
        description: 'CPU limit for ephemeral runner'
      version:
        type: string
        default: '0.0.0'
        description: 'Version string for build'
      build-number:
        type: string
        default: '1'
        description: 'Build number'
      version-title:
        type: string
        default: ''
        description: 'Human-readable version title'
      channel:
        type: string
        required: true
        description: 'Build channel (nightly, beta, rc, release)'
      artifact-name:
        type: string
        default: ''
        description: 'Name for uploaded build artifact'

permissions:
  contents: read
  id-token: write

jobs:
  resolve-runner:
    runs-on: [team-flutter]
    outputs:
      image: ${{ steps.kv.outputs.value }}
    steps:
      - uses: AdGuardSoftwareLimited/actions/actions/kv-get@master
        id: kv
        with:
          key: build-images/windows2022-flutter

  build:
    needs: [resolve-runner]
    runs-on:
      - ephemeral
      - ephemeral-vmwin
      - ${{ needs.resolve-runner.outputs.image }}
      - ephemeral-limit-memory-${{ inputs.runner-memory-mb }}
      - ephemeral-limit-cpu-${{ inputs.runner-cpu }}
      - ephemeral-limit-disk-gb-20
    defaults:
      run:
        shell: bash
    steps:
      - name: Enable Git Bash
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $gitBin = Join-Path $env:ProgramFiles 'Git\bin'
          if (-not (Test-Path (Join-Path $gitBin 'sh.exe'))) {
            Write-Error "sh.exe not found in $gitBin"
            exit 1
          }
          Add-Content -Path $env:GITHUB_PATH -Value $gitBin -Encoding ascii

      - name: Fix Flutter git safe directory
        run: git config --global --add safe.directory "${FLUTTER_ROOT:-C:/flutter}"

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Apply PR overrides
        uses: AdGuardSoftwareLimited/actions/actions/apply-pr-overrides@master

      - name: Flutter pub get and code generation
        run: make init

      - name: Precache Flutter Windows artifacts
        run: flutter precache --windows

      - name: Build Windows
        env:
          GPR_KEY: ${{ secrets.PUBLIC_REPO_GPR_KEY }}
          PROJECT_VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.build-number }}
        run: |
          set -euo pipefail
          flutter build windows --release \
            --build-name="$PROJECT_VERSION" \
            --build-number="$BUILD_NUMBER" \
            --no-pub

      - name: Validate Windows bundle
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $buildDir = 'build\windows\x64\runner\Release'
          $requiredFiles = @(
            'TrustTunnel.exe',
            'cleanup_user_data_helper.exe',
            'app_links_plugin.dll',
            'screen_retriever_windows_plugin.dll',
            'sqlite3.dll',
            'sqlite3_flutter_libs_plugin.dll',
            'url_launcher_windows_plugin.dll',
            'vpn_plugin_plugin.dll',
            'window_manager_plugin.dll',
            'trusttunnel.dll',
            'trusttunnel_service.exe',
            'trusttunnel_service_installer.exe'
          )
          foreach ($file in $requiredFiles) {
            $path = Join-Path $buildDir $file
            if (-not (Test-Path $path -PathType Leaf)) {
              Write-Error "Required Windows bundle file is missing: $path"
              exit 1
            }
          }

      - name: Collect build metadata
        shell: powershell
        run: .\windows\build_scripts\Build-MetadataFile.ps1

      - name: Upload build metadata
        uses: actions/upload-artifact@v7
        with:
          name: trusttunnel-windows-build-metadata
          path: build/windows/metadata/build.json
          if-no-files-found: error

      - name: Upload unsigned Windows bundle
        uses: actions/upload-artifact@v7
        with:
          name: trusttunnel-windows-bundle-unsigned
          path: build/windows/x64/runner/Release/
          if-no-files-found: error

  sign-binaries:
    needs: [build]
    permissions:
      contents: read
      id-token: write
    uses: AdGuardSoftwareLimited/actions/.github/workflows/sign-by-signer.yml@master
    with:
      team: flutter
      artifact-name: trusttunnel-windows-bundle-unsigned
      files: |
        TrustTunnel.exe
        cleanup_user_data_helper.exe
        app_links_plugin.dll
        screen_retriever_windows_plugin.dll
        sqlite3.dll
        sqlite3_flutter_libs_plugin.dll
        url_launcher_windows_plugin.dll
        vpn_plugin_plugin.dll
        window_manager_plugin.dll
        trusttunnel.dll
        trusttunnel_service.exe
        trusttunnel_service_installer.exe
      signed-artifact-name: trusttunnel-windows-bundle-signed

  package-installer:
    needs: [resolve-runner, sign-binaries]
    runs-on:
      - ephemeral
      - ephemeral-vmwin
      - ${{ needs.resolve-runner.outputs.image }}
      - ephemeral-limit-memory-${{ inputs.runner-memory-mb }}
      - ephemeral-limit-cpu-${{ inputs.runner-cpu }}
      - ephemeral-limit-disk-gb-20
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download signed Windows bundle
        uses: actions/download-artifact@v8
        with:
          name: trusttunnel-windows-bundle-signed
          path: build/windows/x64/runner/Release

      - name: Resolve SignTool
        run: |
          $ErrorActionPreference = 'Stop'
          $windowsKitsPath = 'C:\Program Files (x86)\Windows Kits\10\bin'
          $signtoolPath = Get-ChildItem -Path $windowsKitsPath -Directory |
            Where-Object { $_.Name -match '^\d+\.\d+\.\d+\.\d+$' } |
            Sort-Object { [Version]$_.Name } -Descending |
            ForEach-Object { Join-Path $_.FullName 'x64' } |
            Get-ChildItem -Filter signtool.exe -File -Recurse |
            Select-Object -ExpandProperty FullName -First 1
          if (-not $signtoolPath) {
            Write-Error "signtool.exe not found in $windowsKitsPath"
            exit 1
          }
          Write-Host "Using signtool.exe at $signtoolPath"
          Add-Content -Path $env:GITHUB_ENV -Value "SIGNTOOL_PATH=$signtoolPath" -Encoding ascii

      - name: Verify signed Windows bundle
        run: |
          $ErrorActionPreference = 'Stop'
          $buildDir = 'build\windows\x64\runner\Release'
          $signedFiles = @(
            'TrustTunnel.exe',
            'cleanup_user_data_helper.exe',
            'app_links_plugin.dll',
            'screen_retriever_windows_plugin.dll',
            'sqlite3.dll',
            'sqlite3_flutter_libs_plugin.dll',
            'url_launcher_windows_plugin.dll',
            'vpn_plugin_plugin.dll',
            'window_manager_plugin.dll',
            'trusttunnel.dll',
            'trusttunnel_service.exe',
            'trusttunnel_service_installer.exe'
          )
          foreach ($file in $signedFiles) {
            $path = Join-Path $buildDir $file
            & $env:SIGNTOOL_PATH verify /pa /all /v /tw $path
            if ($LASTEXITCODE -ne 0) {
              throw "Authenticode verification failed for $path"
            }
          }

      - name: Build EXE installer
        env:
          APP_VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.build-number }}
        run: |
          $ErrorActionPreference = 'Stop'
          & .\windows\inno\Build-Installer.ps1 `
            -Configuration Release `
            -AppVersion $env:APP_VERSION `
            -BuildNumber $env:BUILD_NUMBER `
            -SkipFlutterBuild

      - name: Upload unsigned installer
        uses: actions/upload-artifact@v7
        with:
          name: trusttunnel-windows-installer-unsigned
          path: build/windows/installer/TrustTunnelSetup.exe
          if-no-files-found: error

  sign-installer:
    needs: [package-installer]
    permissions:
      contents: read
      id-token: write
    uses: AdGuardSoftwareLimited/actions/.github/workflows/sign-by-signer.yml@master
    with:
      team: flutter
      artifact-name: trusttunnel-windows-installer-unsigned
      files: TrustTunnelSetup.exe
      signed-artifact-name: ${{ inputs.artifact-name }}
