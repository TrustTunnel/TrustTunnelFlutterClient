name: Flutter Build Windows

on:
  workflow_call:
    inputs:
      runner-memory-mb:
        type: string
        default: '5120'
        description: 'Memory limit for ephemeral runner in MB'
      runner-cpu:
        type: string
        default: '4'
        description: 'CPU limit for ephemeral runner'
      version:
        type: string
        default: '0.0.0'
        description: 'Version string for build'
      build-number:
        type: string
        default: '1'
        description: 'Build number'
      version-title:
        type: string
        default: ''
        description: 'Human-readable version title'
      channel:
        type: string
        required: true
        description: 'Build channel (nightly, beta, rc, release)'
      artifact-name:
        type: string
        default: ''
        description: 'Name for the final signed installer artifact'

permissions:
  contents: read
  id-token: write

jobs:
  resolve-runner:
    runs-on: [team-flutter]
    outputs:
      image: ${{ steps.kv.outputs.value }}
    steps:
      - uses: AdGuardSoftwareLimited/actions/actions/kv-get@master
        id: kv
        with:
          key: build-images/windows2022-flutter

  build:
    needs: [resolve-runner]
    runs-on:
      - ephemeral
      - ephemeral-vmwin
      - ${{ needs.resolve-runner.outputs.image }}
      - ephemeral-limit-memory-${{ inputs.runner-memory-mb }}
      - ephemeral-limit-cpu-${{ inputs.runner-cpu }}
      - ephemeral-limit-disk-gb-20
      - ephemeral-job-key-${{ github.run_id }}-${{ github.job }}-${{ strategy.job-index || 0 }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Apply PR overrides
        uses: AdGuardSoftwareLimited/actions/actions/apply-pr-overrides@master

      - name: Select Flutter
        env:
          FLUTTER_VERSION: '3.44.9'
        run: |
          set -euo pipefail
          : "${FLUTTER_SDKS_ROOT:?image does not provide versioned Flutter SDKs}"
          sdk="$FLUTTER_SDKS_ROOT/$FLUTTER_VERSION"
          echo "$sdk/bin" >> "$GITHUB_PATH"
          { echo "FLUTTER_ROOT=$sdk"; echo "FLUTTER_HOME=$sdk"; } >> "$GITHUB_ENV"

      - name: Flutter pub get and code generation
        run: make init

      - name: Precache Flutter Windows artifacts
        run: flutter precache --windows

      - name: Build Windows
        env:
          GPR_KEY: ${{ secrets.PUBLIC_REPO_GPR_KEY }}
          PROJECT_VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.build-number }}
        run: |
          set -euo pipefail
          flutter build windows --release \
            --build-name="$PROJECT_VERSION" \
            --build-number="$BUILD_NUMBER" \
            --no-pub

      - name: Validate Windows bundle
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\windows\build_scripts\Verify-WindowsBundle.ps1 `
            -BundlePath build\windows\x64\runner\Release -Architecture x64

      - name: Collect build metadata
        shell: powershell
        run: .\windows\build_scripts\Build-MetadataFile.ps1 -Architecture x64

      - name: Prepare mixed ARM64 bundle
        shell: powershell
        env:
          GPR_KEY: ${{ secrets.PUBLIC_REPO_GPR_KEY }}
        run: .\windows\build_scripts\Prepare-MixedArm64Bundle.ps1

      - name: Upload build metadata
        uses: actions/upload-artifact@v7
        with:
          name: trusttunnel-windows-build-metadata-x64
          path: build/windows/metadata/build.json
          if-no-files-found: error

      - name: Upload unsigned Windows bundle
        uses: actions/upload-artifact@v7
        with:
          name: trusttunnel-windows-bundle-unsigned-x64
          path: build/windows/x64/runner/Release/
          if-no-files-found: error

      - name: Upload unsigned mixed ARM64 bundle
        uses: actions/upload-artifact@v7
        with:
          name: trusttunnel-windows-bundle-unsigned-arm64-mixed
          path: build/windows/arm64-mixed/runner/Release/
          if-no-files-found: error

  sign-binaries:
    needs: [build]
    strategy:
      fail-fast: true
      matrix:
        bundle: [x64, arm64-mixed]
    permissions:
      contents: read
      id-token: write
    uses: AdGuardSoftwareLimited/actions/.github/workflows/sign-by-signer.yml@master
    with:
      team: flutter
      artifact-name: trusttunnel-windows-bundle-unsigned-${{ matrix.bundle }}
      # Wintun keeps its upstream signature.
      files: |
        TrustTunnel.exe
        cleanup_user_data_helper.exe
        app_links_plugin.dll
        flutter_windows.dll
        screen_retriever_windows_plugin.dll
        sqlite3.dll
        sqlite3_flutter_libs_plugin.dll
        tray_manager_plugin.dll
        url_launcher_windows_plugin.dll
        vpn_plugin_plugin.dll
        window_manager_plugin.dll
        trusttunnel.dll
        trusttunnel_service.exe
        trusttunnel_service_installer.exe
      signed-artifact-name: trusttunnel-windows-bundle-signed-${{ matrix.bundle }}

  package-installer:
    needs: [resolve-runner, sign-binaries]
    runs-on:
      - ephemeral
      - ephemeral-vmwin
      - ${{ needs.resolve-runner.outputs.image }}
      - ephemeral-limit-memory-${{ inputs.runner-memory-mb }}
      - ephemeral-limit-cpu-${{ inputs.runner-cpu }}
      - ephemeral-limit-disk-gb-20
      - ephemeral-job-key-${{ github.run_id }}-${{ github.job }}
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download signed x64 Windows bundle
        uses: actions/download-artifact@v8
        with:
          name: trusttunnel-windows-bundle-signed-x64
          path: build/windows/x64/runner/Release

      - name: Download signed mixed ARM64 Windows bundle
        uses: actions/download-artifact@v8
        with:
          name: trusttunnel-windows-bundle-signed-arm64-mixed
          path: build/windows/arm64-mixed/runner/Release

      - name: Build EXE installer
        env:
          APP_VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.build-number }}
        run: |
          $ErrorActionPreference = 'Stop'
          .\windows\inno\Build-Installer.ps1 `
            -Configuration Release `
            -AppVersion $env:APP_VERSION `
            -BuildNumber ([int]$env:BUILD_NUMBER) `
            -SkipFlutterBuild `
            -X64BundlePath build\windows\x64\runner\Release `
            -MixedArm64BundlePath build\windows\arm64-mixed\runner\Release

      - name: Upload unsigned installer
        uses: actions/upload-artifact@v7
        with:
          name: trusttunnel-windows-installer-unsigned
          path: build/windows/installer/TrustTunnelSetup.exe
          if-no-files-found: error

  sign-installer:
    needs: [package-installer]
    permissions:
      contents: read
      id-token: write
    uses: AdGuardSoftwareLimited/actions/.github/workflows/sign-by-signer.yml@master
    with:
      team: flutter
      artifact-name: trusttunnel-windows-installer-unsigned
      files: TrustTunnelSetup.exe
      signed-artifact-name: ${{ inputs.artifact-name || 'trusttunnel-windows-installer' }}

  cleanup-artifacts:
    # Wait for every producer/consumer, including when signing or packaging fails.
    needs: [build, sign-binaries, package-installer, sign-installer]
    if: ${{ always() }}
    runs-on: [team-flutter]
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Delete intermediate artifacts
        uses: actions/github-script@v8
        env:
          FINAL_ARTIFACT_NAME: ${{ inputs.artifact-name || 'trusttunnel-windows-installer' }}
          SIGN_INSTALLER_RESULT: ${{ needs.sign-installer.result }}
        with:
          retries: 3
          script: |
            const keep = new Set([
              process.env.FINAL_ARTIFACT_NAME,
              'trusttunnel-windows-build-metadata-x64',
            ]);
            // Artifacts from other platform jobs in the caller run must remain intact.
            const intermediate = new Set([
              'trusttunnel-windows-bundle-unsigned-x64',
              'trusttunnel-windows-bundle-unsigned-arm64-mixed',
              'trusttunnel-windows-bundle-signed-x64',
              'trusttunnel-windows-bundle-signed-arm64-mixed',
              'trusttunnel-windows-installer-unsigned',
            ]);
            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              { ...context.repo, run_id: context.runId, per_page: 100 },
            );
            if (process.env.SIGN_INSTALLER_RESULT === 'success') {
              const missing = [...keep].filter(
                (name) => !artifacts.some((a) => a.name === name && !a.expired),
              );
              if (missing.length) {
                throw new Error(`Expected final artifact(s) not found: ${missing.join(', ')}`);
              }
            }
            const stale = artifacts.filter(
              (a) => intermediate.has(a.name) && !keep.has(a.name),
            );
            for (const a of stale) {
              core.info(`Deleting artifact: ${a.name} (id: ${a.id})`);
              await github.rest.actions.deleteArtifact({ ...context.repo, artifact_id: a.id });
            }
            const retained = artifacts.filter((a) => keep.has(a.name)).map((a) => a.name);
            core.notice(`Deleted ${stale.length} intermediate artifact(s), retained: ${retained.join(', ') || 'none'}`);
