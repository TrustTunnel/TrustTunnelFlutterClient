name: Flutter Build Windows

on:
  workflow_call:
    inputs:
      runner-memory-mb:
        type: string
        default: '12288'
        description: 'Memory limit for ephemeral runner in MB'
      runner-cpu:
        type: string
        default: '4'
        description: 'CPU limit for ephemeral runner'
      version:
        type: string
        default: '0.0.0'
        description: 'Version string for build'
      build-number:
        type: string
        default: '1'
        description: 'Build number'
      version-title:
        type: string
        default: ''
        description: 'Human-readable version title'
      channel:
        type: string
        required: true
        description: 'Build channel (nightly, beta, rc, release)'
      artifact-name:
        type: string
        default: ''
        description: 'Name for uploaded build artifact'

permissions:
  contents: read
  id-token: write

jobs:
  resolve-runner:
    runs-on: [team-flutter]
    outputs:
      image: ${{ steps.kv.outputs.value }}
    steps:
      - uses: AdGuardSoftwareLimited/actions/actions/kv-get@master
        id: kv
        with:
          key: build-images/windows2022-flutter

  build:
    needs: [resolve-runner]
    runs-on:
      - ephemeral
      - ephemeral-vmwin
      - ${{ needs.resolve-runner.outputs.image }}
      - ephemeral-limit-memory-${{ inputs.runner-memory-mb }}
      - ephemeral-limit-cpu-${{ inputs.runner-cpu }}
      - ephemeral-limit-disk-gb-20
      - ephemeral-job-key-${{ github.run_id }}-${{ github.job }}-${{ strategy.job-index || 0 }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Apply PR overrides
        uses: AdGuardSoftwareLimited/actions/actions/apply-pr-overrides@master

      - name: Select Flutter
        env:
          FLUTTER_VERSION: '3.44.8'
        run: |
          set -euo pipefail
          : "${FLUTTER_SDKS_ROOT:?image does not provide versioned Flutter SDKs}"
          sdk="$FLUTTER_SDKS_ROOT/$FLUTTER_VERSION"
          echo "$sdk/bin" >> "$GITHUB_PATH"
          { echo "FLUTTER_ROOT=$sdk"; echo "FLUTTER_HOME=$sdk"; } >> "$GITHUB_ENV"

      - name: Flutter pub get and code generation
        run: make init

      - name: Precache Flutter Windows artifacts
        run: flutter precache --windows

      - name: Build Windows
        env:
          GPR_KEY: ${{ secrets.PUBLIC_REPO_GPR_KEY }}
          PROJECT_VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.build-number }}
        run: |
          set -euo pipefail
          flutter build windows --release \
            --build-name="$PROJECT_VERSION" \
            --build-number="$BUILD_NUMBER" \
            --no-pub

      - name: Validate Windows bundle
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\windows\build_scripts\Verify-WindowsBundle.ps1 `
            -BundlePath build\windows\x64\runner\Release -Architecture x64

      - name: Collect build metadata
        shell: powershell
        run: .\windows\build_scripts\Build-MetadataFile.ps1 -Architecture x64

      - name: Prepare mixed ARM64 bundle
        shell: powershell
        env:
          GPR_KEY: ${{ secrets.PUBLIC_REPO_GPR_KEY }}
        run: .\windows\build_scripts\Prepare-MixedArm64Bundle.ps1

      - name: Upload build metadata
        uses: actions/upload-artifact@v7
        with:
          name: trusttunnel-windows-build-metadata-x64
          path: build/windows/metadata/build.json
          if-no-files-found: error

      - name: Upload unsigned Windows bundle
        uses: actions/upload-artifact@v7
        with:
          name: trusttunnel-windows-bundle-unsigned-x64
          path: build/windows/x64/runner/Release/
          if-no-files-found: error

      - name: Upload unsigned mixed ARM64 bundle
        uses: actions/upload-artifact@v7
        with:
          name: trusttunnel-windows-bundle-unsigned-arm64-mixed
          path: build/windows/arm64-mixed/runner/Release/
          if-no-files-found: error

  sign-binaries:
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        bundle: [x64, arm64-mixed]
    permissions:
      contents: read
      id-token: write
    uses: AdGuardSoftwareLimited/actions/.github/workflows/sign-by-signer.yml@master
    with:
      team: flutter
      artifact-name: trusttunnel-windows-bundle-unsigned-${{ matrix.bundle }}
      # Wintun keeps its upstream signature; the package job verifies it.
      files: |
        TrustTunnel.exe
        cleanup_user_data_helper.exe
        app_links_plugin.dll
        flutter_windows.dll
        screen_retriever_windows_plugin.dll
        sqlite3.dll
        sqlite3_flutter_libs_plugin.dll
        url_launcher_windows_plugin.dll
        vpn_plugin_plugin.dll
        window_manager_plugin.dll
        trusttunnel.dll
        trusttunnel_service.exe
        trusttunnel_service_installer.exe
      signed-artifact-name: trusttunnel-windows-bundle-signed-${{ matrix.bundle }}

  package-installer:
    needs: [resolve-runner, sign-binaries]
    strategy:
      fail-fast: false
      matrix:
        bundle: [x64, arm64-mixed]
    runs-on:
      - ephemeral
      - ephemeral-vmwin
      - ${{ needs.resolve-runner.outputs.image }}
      - ephemeral-limit-memory-${{ inputs.runner-memory-mb }}
      - ephemeral-limit-cpu-${{ inputs.runner-cpu }}
      - ephemeral-limit-disk-gb-20
      - ephemeral-job-key-${{ github.run_id }}-${{ github.job }}-${{ strategy.job-index || 0 }}
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download signed Windows bundle
        uses: actions/download-artifact@v8
        with:
          name: trusttunnel-windows-bundle-signed-${{ matrix.bundle }}
          path: build/windows/${{ matrix.bundle }}/runner/Release

      - name: Resolve SignTool
        run: |
          $ErrorActionPreference = 'Stop'
          $windowsKitsPath = 'C:\Program Files (x86)\Windows Kits\10\bin'
          $sdkDirectories = Get-ChildItem -Path $windowsKitsPath -Directory |
            Where-Object { $_.Name -match '^\d+\.\d+\.\d+\.\d+$' } |
            Sort-Object { [Version]$_.Name } -Descending
          $signtoolPath = $sdkDirectories |
            ForEach-Object { Join-Path $_.FullName 'x64\signtool.exe' } |
            Where-Object { Test-Path $_ -PathType Leaf } |
            Select-Object -First 1
          if (-not $signtoolPath) {
            Write-Error "signtool.exe not found in $windowsKitsPath"
            exit 1
          }
          Write-Host "Using signtool.exe at $signtoolPath"
          Add-Content -Path $env:GITHUB_ENV -Value "SIGNTOOL_PATH=$signtoolPath" -Encoding ascii

      - name: Verify signed Windows bundle
        env:
          BUNDLE_ARCHITECTURE: ${{ matrix.bundle }}
        run: |
          $ErrorActionPreference = 'Stop'
          .\windows\build_scripts\Verify-WindowsBundle.ps1 `
            -BundlePath "build\windows\$env:BUNDLE_ARCHITECTURE\runner\Release" `
            -Architecture $env:BUNDLE_ARCHITECTURE `
            -SignToolPath $env:SIGNTOOL_PATH

      - name: Build EXE installer
        env:
          APP_VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.build-number }}
          BUNDLE_ARCHITECTURE: ${{ matrix.bundle }}
        run: |
          $ErrorActionPreference = 'Stop'
          $targetArchitecture = if ($env:BUNDLE_ARCHITECTURE -eq 'arm64-mixed') { 'arm64' } else { 'x64' }
          $arguments = @{
            Configuration = 'Release'
            Architecture = $targetArchitecture
            AppVersion = $env:APP_VERSION
            BuildNumber = [int]$env:BUILD_NUMBER
            SkipFlutterBuild = $true
            BundlePath = "build\windows\$env:BUNDLE_ARCHITECTURE\runner\Release"
          }
          if ($env:BUNDLE_ARCHITECTURE -eq 'arm64-mixed') { $arguments.MixedArm64 = $true }
          & .\windows\inno\Build-Installer.ps1 @arguments

      - name: Upload unsigned installer
        uses: actions/upload-artifact@v7
        with:
          name: trusttunnel-windows-installer-unsigned-${{ matrix.bundle }}
          path: build/windows/installer/TrustTunnelSetup-${{ matrix.bundle }}.exe
          if-no-files-found: error

  sign-installer:
    needs: [package-installer]
    strategy:
      fail-fast: false
      matrix:
        bundle: [x64, arm64-mixed]
    permissions:
      contents: read
      id-token: write
    uses: AdGuardSoftwareLimited/actions/.github/workflows/sign-by-signer.yml@master
    with:
      team: flutter
      artifact-name: trusttunnel-windows-installer-unsigned-${{ matrix.bundle }}
      files: TrustTunnelSetup-${{ matrix.bundle }}.exe
      signed-artifact-name: ${{ inputs.artifact-name }}-${{ matrix.bundle }}
