name: Flutter Test

on:
  workflow_call:
    inputs:
      container-image:
        type: string
        default: 'registry.int.agrd.dev/library/flutter-android:3.38.3--2'
        description: 'Docker container image. Empty = run directly on runner'
      runner-memory-mb:
        type: string
        default: '5120'
        description: 'Memory limit for ephemeral runner in MB'
      runner-cpu:
        type: string
        default: '2'
        description: 'CPU limit for ephemeral runner'

permissions:
  contents: read

jobs:
  resolve-runner:
    runs-on: [team-flutter]
    outputs:
      image: ${{ steps.kv.outputs.value }}
    steps:
      - uses: AdGuardSoftwareLimited/actions/actions/kv-get@master
        id: kv
        with:
          key: build-images/flutter-android-builder

  test:
    needs: [resolve-runner]
    runs-on:
      - ephemeral
      - ephemeral-linux
      - ${{ needs.resolve-runner.outputs.image }}
      - ephemeral-limit-memory-${{ inputs.runner-memory-mb }}
      - ephemeral-limit-cpu-${{ inputs.runner-cpu }}
      - ephemeral-limit-disk-gb-20
    container: ${{ inputs.container-image }}
    defaults:
      run:
        shell: bash
    env:
      GPR_KEY: ${{ secrets.PUBLIC_REPO_GPR_KEY  }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Apply PR overrides
        uses: AdGuardSoftwareLimited/actions/actions/apply-pr-overrides@master

      - name: Check if tests exist
        id: check-tests
        run: |
          if [ -d test ] && [ "$(find test -name '*.dart' -type f | head -1)" ]; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No test files found in test/, skipping."
          fi

      - name: Initialize project
        if: steps.check-tests.outputs.has_tests == 'true'
        run: make init

      - name: Flutter test
        if: steps.check-tests.outputs.has_tests == 'true'
        run: flutter test
