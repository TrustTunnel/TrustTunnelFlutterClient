name: Flutter Lint

on:
  workflow_call:
    inputs:
      prepare-script:
        type: string
        default: ''
        description: 'Shell commands to run after checkout (e.g. keystore setup, env config). Vault secrets are available as env vars. Empty = skip'
      container-image:
        type: string
        default: 'registry.int.agrd.dev/library/flutter-android:3.38.3--2'
        description: 'Docker container image. Empty = run directly on runner'
      runner-memory-mb:
        type: string
        default: '5120'
        description: 'Memory limit for ephemeral runner in MB'
      runner-cpu:
        type: string
        default: '2'
        description: 'CPU limit for ephemeral runner'

permissions:
  contents: read

jobs:
  resolve-runner:
    runs-on: [team-flutter]
    outputs:
      image: ${{ steps.kv.outputs.value }}
    steps:
      - uses: AdGuardSoftwareLimited/actions/actions/kv-get@master
        id: kv
        with:
          key: build-images/flutter-android-builder

  lint:
    needs: [resolve-runner]
    runs-on:
      - ephemeral
      - ephemeral-linux
      - ${{ needs.resolve-runner.outputs.image }}
      - ephemeral-limit-memory-${{ inputs.runner-memory-mb }}
      - ephemeral-limit-cpu-${{ inputs.runner-cpu }}
      - ephemeral-limit-disk-gb-20
    container: ${{ inputs.container-image }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Apply PR overrides
        uses: AdGuardSoftwareLimited/actions/actions/apply-pr-overrides@master

      - name: Initialize dependencies
        run: flutter pub get

      - name: Check formatting issues
        run: dart format -o none --set-exit-if-changed .

      - name: Prepare environment
        if: inputs.prepare-script != ''
        run: ${{ inputs.prepare-script }}

      - name: Flutter analyze
        run: flutter analyze --no-pub
