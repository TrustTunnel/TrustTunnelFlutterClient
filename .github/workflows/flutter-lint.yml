name: Flutter Lint

on:
  workflow_call:
    inputs:
      team:
        description: 'Team name for the self-hosted Docker-capable Linux runner (e.g. mobile, infra, platform). Resolves to the team-<name> runner label.'
        type: string
        default: 'flutter'
      prepare-script:
        type: string
        default: ''
        description: 'Shell commands to run after checkout (e.g. dart run build_runner build)'

permissions:
  contents: read

jobs:
  resolve-runner:
    runs-on: team-${{ inputs.team }}
    outputs:
      image: ${{ steps.kv.outputs.value }}
    steps:
      - uses: AdGuardSoftwareLimited/actions/actions/kv-get@master
        id: kv
        with:
          key: build-images/macos

  lint:
    needs: [resolve-runner]
    runs-on:
      - ephemeral
      - ephemeral-mac
      - ${{ needs.resolve-runner.outputs.image }}
      - ephemeral-limit-memory-5120
      - ephemeral-limit-cpu-4
      - ephemeral-limit-disk-gb-20
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      
      - name: Initialize dependencies
        run: flutter pub get
        
      - name: Check formatting issues
        run: dart format -o none --set-exit-if-changed .

      - name: Prepare environment
        if: inputs.prepare-script != ''
        run: ${{ inputs.prepare-script }}

      - name: Flutter analyze
        run: flutter analyze --no-pub