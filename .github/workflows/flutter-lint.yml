name: Flutter Lint

on:
  workflow_call:
    inputs:
      prepare-script:
        type: string
        default: ''
        description: 'Shell commands to run after checkout (e.g. keystore setup, env config). Vault secrets are available as env vars. Empty = skip'

permissions:
  contents: read

jobs:
  resolve-runner:
    runs-on: [team-flutter]
    outputs:
      image: ${{ steps.kv.outputs.value }}
    steps:
      - uses: AdGuardSoftwareLimited/actions/actions/kv-get@master
        id: kv
        with:
          key: build-images/macos

  lint:
    needs: [resolve-runner]
    runs-on:
      - ephemeral
      - ephemeral-mac
      - ${{ needs.resolve-runner.outputs.image }}
      - ephemeral-limit-memory-5120
      - ephemeral-limit-cpu-2
      - ephemeral-limit-disk-gb-20
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Apply PR overrides
        uses: AdGuardSoftwareLimited/actions/actions/apply-pr-overrides@master
      
      - name: Check formatting issues
        run: dart format -o none --set-exit-if-changed .

      - name: Prepare environment
        env:
          PREPARE_SCRIPT: ${{ inputs.prepare-script }}
        run: |
          if [ -z "$PREPARE_SCRIPT" ]; then
            flutter pub get
          else
            eval "$PREPARE_SCRIPT"
          fi

      - name: Flutter analyze
        run: flutter analyze --no-pub