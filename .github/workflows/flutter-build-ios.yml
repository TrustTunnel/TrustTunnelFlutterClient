name: Flutter Build iOS

# The iOS build of this product through the shared build-ios-app.yml: the Flutter and CocoaPods
# preparation of this repository is the prepare-script, the shared workflow builds the app once
# without signing material (xcodebuild action), signs every distribution of that build in its own
# job (sign-apple) and uploads the artifacts as before. The build is described by the fastlane env
# file (fastlane-env-path: CUSTOM_FASTLANE_SCHEMA, CUSTOM_FASTLANE_BUILD_NAME, FASTLANE_BUILD_DIRECTORY,
# APP_IDENTIFIERS, TEAM_ID); the outputs land where the fastlane lanes put them: ios/build/<name>.ipa,
# ios/build/AppStoreInfo.plist and ios/build/<name>.app.zip.

on:
  workflow_call:
    inputs:
      version:
        type: string
        default: '0.0.0'
        description: 'Version string for build'
      build-number:
        type: string
        default: '1'
        description: 'Build number'
      version-title:
        type: string
        default: ''
        description: 'Human-readable version title'
      build-mode:
        type: string
        default: 'ipa'
        description: 'ipa | simulator'
      signing-type:
        type: string
        default: 'adhoc'
        description: 'iOS signing type: adhoc, appstore, development'
      channel:
        type: string
        required: true
        description: 'Build channel (nightly, beta, rc, release)'
      artifact-name:
        type: string
        default: ''
        description: 'Name for uploaded build artifact'
      artifact-path:
        type: string
        default: ''
        description: 'Path to build output file(s)'
      additional-distributions:
        type: string
        default: '[]'
        description: 'More distributions signed from the same device build, as a JSON array of {"signing-type", "artifact-name", "artifact-path"} (not for build-mode simulator)'
      fastlane-env-path:
        type: string
        default: 'ios/fastlane/.env'

permissions:
  contents: read
  id-token: write

jobs:
  build:
    uses: AdGuardSoftwareLimited/actions/.github/workflows/build-ios-app.yml@master
    secrets: inherit
    with:
      channel: ${{ inputs.channel }}
      version: ${{ inputs.version }}
      version-title: ${{ inputs.version-title }}
      build-number: ${{ inputs.build-number }}
      signing-type: ${{ inputs.signing-type }}
      build-mode: ${{ inputs.build-mode }}
      signing-env-file: ${{ inputs.fastlane-env-path }}
      prepare-secret: PUBLIC_REPO_GPR_KEY
      prepare-secret-env: GPR_KEY
      prepare-script: |
        set -euo pipefail
        set -x

        # Flutter of the image (/opt/flutter), owned by another user.
        git config --global --add safe.directory /opt/flutter

        # Ruby for CocoaPods.
        eval "$(rbenv init - bash)"
        rbenv install 3.3.10 --skip-existing
        rbenv local 3.3.10
        rbenv rehash
        printf '%s\n' "$HOME/.rbenv/bin" "$HOME/.rbenv/shims" >> "$GITHUB_PATH"
        gem install bundler -v 2.7.2
        rbenv rehash
        export BUNDLER_VERSION=2.7.2
        (cd ios && bundle config set --local path '.bundle/vendor' && bundle install)

        make init
        flutter precache --ios
        (cd ios && bundle exec pod install)

        flutter build ios --release \
          --build-name="${{ inputs.version }}" \
          --build-number="${{ inputs.build-number }}" \
          --no-pub \
          --config-only

        # CocoaPods vendored frameworks may carry pre-release versions ("1.2.3-beta.4", "5.0.0+abc"),
        # which code signing and App Store validation reject: keep the SemVer core of
        # CFBundleShortVersionString and CFBundleVersion.
        changed=0
        while IFS= read -r -d '' plist; do
          for key in CFBundleShortVersionString CFBundleVersion; do
            value="$(/usr/libexec/PlistBuddy -c "Print :$key" "$plist" 2>/dev/null || true)"
            [ -z "$value" ] && continue
            clean="${value%%[-+]*}"
            if [ "$clean" != "$value" ]; then
              echo "Sanitizing $key '$value' -> '$clean' in $plist"
              /usr/libexec/PlistBuddy -c "Set :$key $clean" "$plist"
              changed=1
            fi
          done
        done < <(find ios/Pods -type f -name Info.plist -path '*.framework/*' -print0)
        [ "$changed" -eq 1 ] || echo "No pre-release framework versions found."
      artifact-name: ${{ inputs.artifact-name }}
      artifact-path: ${{ inputs.artifact-path }}
      artifact-archive: true
      additional-distributions: ${{ inputs.additional-distributions }}
