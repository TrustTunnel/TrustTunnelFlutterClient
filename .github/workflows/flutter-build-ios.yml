name: Flutter Build iOS

# The iOS build of this product through the shared build-flutter-ios-app.yml (AdGuardSoftwareLimited/actions):
# the Flutter SDK of the project and the preparation of this repository run in the build job, the shared
# workflow archives Runner once without signing material, signs every signing type from that archive in its
# own job (or builds for the simulator) and names the artifacts after the product; the names are the outputs
# (the archived app is Runner.app, so the artifacts are Runner-appstore, Runner.ipa and Runner.app.zip).

on:
  workflow_call:
    inputs:
      version:
        type: string
        default: '0.0.0'
        description: 'Version string for build'
      build-number:
        type: string
        default: '1'
        description: 'Build number'
      version-title:
        type: string
        default: ''
        description: 'Human-readable version title'
      channel:
        type: string
        required: true
        description: 'Build channel (nightly, beta, rc, release)'
      signing-types:
        type: string
        default: ''
        description: 'Distribution methods signed from the one device archive, comma-separated: appstore, adhoc. Empty for build-mode simulator'
      build-mode:
        type: string
        default: 'ipa'
        description: 'ipa | simulator'
      sentry-project:
        type: string
        default: ''
        description: 'Sentry project slug. If empty, Sentry upload is skipped.'
      release:
        type: string
        default: ''
        description: 'Release identifier for Sentry (e.g. "5.0")'
    outputs:
      product-name:
        description: 'The application the archive holds (Runner)'
        value: ${{ jobs.build.outputs.product-name }}
      appstore-artifact:
        description: 'Runner-appstore: Runner.ipa + AppStoreInfo.plist, what deploy-to-testflight.yml takes'
        value: ${{ jobs.build.outputs.appstore-artifact }}
      adhoc-artifact:
        description: 'Runner.ipa: the Ad Hoc IPA for testers'
        value: ${{ jobs.build.outputs.adhoc-artifact }}
      simulator-artifact:
        description: 'Runner.app.zip: the simulator app, what deploy-to-appetize.yml takes'
        value: ${{ jobs.build.outputs.simulator-artifact }}

permissions:
  contents: read
  id-token: write

jobs:
  build:
    uses: AdGuardSoftwareLimited/actions/.github/workflows/build-flutter-ios-app.yml@master
    secrets: inherit
    with:
      flutter-version: '3.44.9'
      signing-types: ${{ inputs.signing-types }}
      build-mode: ${{ inputs.build-mode }}
      app-identifiers: com.adguard.TrustTunnel,com.adguard.TrustTunnel.Extension
      channel: ${{ inputs.channel }}
      version: ${{ inputs.version }}
      version-title: ${{ inputs.version-title }}
      build-number: ${{ inputs.build-number }}
      release: ${{ inputs.release }}
      sentry-project: ${{ inputs.sentry-project }}
      # The package registry token of the preparation: the one secret the build job receives.
      prepare-secret: PUBLIC_REPO_GPR_KEY
      prepare-secret-env: GPR_KEY
      # The preparation of this repository, run in the build job with the Flutter SDK on PATH; PROJECT_VERSION
      # and BUILD_NUMBER are the version inputs.
      prepare-script: |
        set -x
        # Ruby for CocoaPods.
        eval "$(rbenv init - bash)"
        rbenv install 3.3.10 --skip-existing
        rbenv local 3.3.10
        rbenv rehash
        printf '%s\n' "$HOME/.rbenv/bin" "$HOME/.rbenv/shims" >> "$GITHUB_PATH"
        gem install bundler -v 2.7.2
        rbenv rehash
        export BUNDLER_VERSION=2.7.2
        (cd ios && bundle config set --local path '.bundle/vendor' && bundle install)
        # Dependencies and code generation (the package registry token is GPR_KEY), the iOS engine
        # artifacts, CocoaPods.
        git config --global --add safe.directory /opt/flutter
        make init
        flutter precache --ios
        (cd ios && bundle exec pod install)
        # The Xcode configuration of the Flutter tool: the version and the build number.
        flutter build ios --release --build-name="$PROJECT_VERSION" --build-number="$BUILD_NUMBER" --no-pub --config-only
        # CocoaPods vendored frameworks may carry pre-release versions ("1.2.3-beta.4", "5.0.0+abc"), which
        # code signing and App Store validation reject: keep the SemVer core of CFBundleShortVersionString
        # and CFBundleVersion.
        changed=0
        while IFS= read -r -d '' plist; do
          for key in CFBundleShortVersionString CFBundleVersion; do
            value="$(/usr/libexec/PlistBuddy -c "Print :$key" "$plist" 2>/dev/null || true)"
            [ -z "$value" ] && continue
            clean="${value%%[-+]*}"
            if [ "$clean" != "$value" ]; then
              echo "Sanitizing $key '$value' -> '$clean' in $plist"
              /usr/libexec/PlistBuddy -c "Set :$key $clean" "$plist"
              changed=1
            fi
          done
        done < <(find ios/Pods -type f -name Info.plist -path '*.framework/*' -print0)
        [ "$changed" -eq 1 ] || echo "No pre-release framework versions found."
