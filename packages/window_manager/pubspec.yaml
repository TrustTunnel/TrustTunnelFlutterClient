name: window_manager
description: Internal window management plugin for TrustTunnel desktop clients.
version: 0.5.0-pre.1
publish_to: none

platforms:
  linux:
  macos:
  windows:

environment:
  sdk: ^3.8.0
  flutter: ">=3.3.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  path: ^1.8.2
  screen_retriever: ^0.2.0

dev_dependencies:
  dependency_validator: ^3.0.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      linux:
        pluginClass: WindowManagerPlugin
      macos:
        pluginClass: WindowManagerPlugin
      windows:
        pluginClass: WindowManagerPlugin
